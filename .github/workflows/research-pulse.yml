name: Publish research pulse

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gather papers and generate questions
        if: github.event_name != 'push' || hashFiles('research-pulse.json') == ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python3 tools/update_research_pulse.py
      - name: Save the dated issue and archive
        if: github.event_name != 'push' || hashFiles('research-pulse.json') == ''
        run: |
          if ! git diff --quiet -- research-pulse.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research-pulse.json
            git commit -m 'Update weekly research pulse'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
