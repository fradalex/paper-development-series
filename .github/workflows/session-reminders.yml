name: Schedule seminar reminders

on:
  push:
    branches: [main]
    paths:
      - 'site-data.js'
      - 'tools/send_session_reminders.mjs'
      - 'tools/send_session_reminders.test.mjs'
      - '.github/workflows/session-reminders.yml'
  # A second existing automatic workflow can recover a missed reminder trigger.
  workflow_run:
    workflows: ['Publish research pulse']
    types: [completed]
  schedule:
    - cron: '17 1 * * *'
      timezone: 'Europe/Rome'
    - cron: '47 4 * * *'
      timezone: 'Europe/Rome'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the next seven days without contacting Kit'
        type: boolean
        default: true
      verify_setup:
        description: 'Check Kit key and one-person tag without sending'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: seminar-reminders
  cancel-in-progress: false

jobs:
  reminders:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success')
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test reminder planning and duplicate protection
        run: node --test tools/send_session_reminders.test.mjs
      - name: Verify Kit connection and test tag
        if: github.event_name == 'workflow_dispatch' && inputs.verify_setup
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_TEST_TAG_NAME: PDS test
        run: node tools/send_session_reminders.mjs --check
      - name: Preview reminder schedule
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run && !inputs.verify_setup
        run: node tools/send_session_reminders.mjs
      - name: Synchronise reminders with Kit
        if: github.event_name != 'workflow_dispatch' || (!inputs.dry_run && !inputs.verify_setup)
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_TEST_TAG_NAME: PDS test
        run: node tools/send_session_reminders.mjs --send

