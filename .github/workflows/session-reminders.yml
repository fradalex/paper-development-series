name: Schedule seminar reminders

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview due reminders without contacting Kit'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: seminar-reminders
  cancel-in-progress: false

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview due reminders
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: node tools/send_session_reminders.mjs
      - name: Schedule due reminders through Kit
        if: github.event_name == 'schedule' || !inputs.dry_run
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: node tools/send_session_reminders.mjs --send
